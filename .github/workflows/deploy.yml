name: Deploy

# Manual only. Publishing to GitHub Pages from a private repo needs a paid plan,
# and nothing here should push the game public on its own. Run it from the
# Actions tab when you actually want to publish — and set Settings > Pages >
# Source to "GitHub Actions" first, or it will fail.
on:
  workflow_dispatch:

# Needed by actions/deploy-pages to publish and to mint its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Don't publish something that does not typecheck or pass its tests.
      - run: npm run check

      # Pages serves a project repo from /<repo>/, unlike everywhere else.
      - run: npm run build
        env:
          BASE_PATH: /booleanclash/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
