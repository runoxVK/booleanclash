name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, and fails if the
      # lockfile is out of sync with package.json. That is what you want in CI.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test
